name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python main.py`
        2. Switch to mouse mode with TAB
        3. ...
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Webcam and lighting
      placeholder: Built-in 720p laptop camera, indoor light
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
